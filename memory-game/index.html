<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm Animals Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1>Farm Animals Match</h1>
      <div class="game__controls">
        <p class="stat">Tries: <span id="moves">0</span></p>
        <button type="button" id="restart" class="btn">New game</button>
      </div>
    </header>

    <p id="status" class="status" aria-live="polite">Tap a card to find the animal.</p>

    <section id="board" class="board" aria-label="Memory cards"></section>

    <canvas id="fireworks" class="fireworks" aria-hidden="true"></canvas>

    <div id="win" class="win" hidden>
      <div class="win__box" role="dialog" aria-labelledby="win-title">
        <h2 id="win-title">🎉 You found them all! 🎉</h2>
        <p>Great job! You matched every animal in <strong id="win-moves">0</strong> tries.</p>
        <button type="button" id="play-again" class="btn btn--big">Play again</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
